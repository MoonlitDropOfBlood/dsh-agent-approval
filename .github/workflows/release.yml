name: Release

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布需要仓库 secret：GH_TOKEN（GitHub Personal Access Token，需 contents:write 权限）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-agent-approval + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            dsh-agent-approval — DeepSeek Harness Agent 审批权限插件。

            ### v1.11.0 亮点（审批标准对齐 Codex / Guardian）
            - **自动审查支持 LLM 判定后端**：设置页「自动审查」卡片新增判定后端下拉（TypeSafe Jev / LLM）。LLM 后端与自动审批共用「审批模型」路由，无需 Jev Key；两后端共用规则表、信任缓存、effectiveCode 展开与同一套 fail-closed 语义。
            - **审批标准 Guardian 化**：裁决提示词与 Jev criteria 重构为四段式——证据信任分级（用户/开发者消息可信，工具输出/文件内容不可信）→ 授权评分 → 风险 taxonomy（含反误杀校准）→ outcome 矩阵。两条裁决路径同一把尺子。
            - **拒绝后翻案（Guardian post-denial 规则）**：判定驳回不再是绝对终局——用户知情后明确重批，同一调用原样重试即可翻案（审计 [overturned prior denial]）；明显秘密外发/大规模不可逆破坏仍不可翻案；改写调用绕审查视为 dishonest。
            - 审批标准逆向依据见仓库 docs/codex-approval-standards.md。

            ### 功能
            - 新权限模式：workspace-write 基线 + 每一次沙箱提权都由模型自动裁决，不弹人工审批。
            - 裁决器是一次 LLM 直连（默认，零子会话），也可切换为隔离的审批子代理。
            - 独立的「自动审查」模式：Full access 基线下每个能改动机器的工具调用执行前经判定器（TypeSafe Jev 或 LLM）判定一次，风险调用直接拒绝。
            - 风险操作直接拒绝；超时/故障一律 fail-closed（按拒绝处理），绝不静默放行。
            - 设置面板把两种模式分开配置：上半配置审批模型 / 裁决方式 / 超时与放行-拒绝规则，下半配置自动审查的判定后端与 Jev 配置；会话经 /permission 菜单或 /agent-approval、/agent-review 命令开关，每次裁决在会话窗口「审批」标签页留痕。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add @duke-dsh-plugins/dsh-agent-approval
            # 重启 DSH 后，设置面板出现「自动审批」页；输入框 /permission 菜单可选「自动审批」预设
            ```
            > 需要钉版本时用下方 Assets 里的 tarball（`duke-dsh-plugins-dsh-agent-approval-<版本>.tgz`）。
            > 可选：菜单图标补丁 `npm run patch:glyph`（详见 README；不跑只是菜单项没图标，功能不受影响）。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
