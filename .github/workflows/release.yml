name: Release

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布需要仓库 secret：GH_TOKEN（GitHub Personal Access Token，需 contents:write 权限）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-agent-approval + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            dsh-agent-approval — DeepSeek Harness Agent 审批权限插件。

            ### v1.12.0 亮点（性能与委派链审查）
            - **审批上下文增量投影**：原始工具参数与真实用户消息按会话事件增量折叠；50,000 事件会话的热路径不再重复全量扫描。
            - **审计记录分页与增量索引**：JSONL 冷读后按追加字节更新，支持稳定的 before/after 游标、旧 Host 回退与有界实时视图，长会话不再反复读取完整审计文件。
            - **自动审查沿委派链覆盖子代理**：子、孙会话的机器修改调用同样受审；父会话销毁后快照仍有效，父会话后进入审查也会覆盖已有后代。
            - **子会话自己的选择优先**：显式选择自动审批或其它预设可退出继承审查；自动审批仍不向 spawn 子代理传播，避免递归审批。
            - 审批标准逆向依据见仓库 docs/codex-approval-standards.md。

            ### 功能
            - 新权限模式：workspace-write 基线 + 每一次沙箱提权都由模型自动裁决，不弹人工审批。
            - 裁决器是一次 LLM 直连（默认，零子会话），也可切换为隔离的审批子代理。
            - 独立的「自动审查」模式：Full access 基线下每个能改动机器的工具调用执行前经判定器（TypeSafe Jev 或 LLM）判定一次，风险调用直接拒绝。
            - 风险操作直接拒绝；超时/故障一律 fail-closed（按拒绝处理），绝不静默放行。
            - 设置面板把两种模式分开配置：上半配置审批模型 / 裁决方式 / 超时与放行-拒绝规则，下半配置自动审查的判定后端与 Jev 配置；会话经 /permission 菜单或 /agent-approval、/agent-review 命令开关，每次裁决在会话窗口「审批」标签页留痕。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add @duke-dsh-plugins/dsh-agent-approval
            # 重启 DSH 后，设置面板出现「自动审批」页；输入框 /permission 菜单可选「自动审批」预设
            ```
            > 需要钉版本时用下方 Assets 里的 tarball（`duke-dsh-plugins-dsh-agent-approval-<版本>.tgz`）。
            > 可选：菜单图标补丁 `npm run patch:glyph`（详见 README；不跑只是菜单项没图标，功能不受影响）。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
